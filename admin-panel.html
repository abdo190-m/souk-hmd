/* =========================================
   SAFE HTML
========================================= */

function safe(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   SAFE URL
========================================= */

function safeURL(value){

    const url =
        String(value || "").trim();

    if(!url){
        return "";
    }

    /*
       السماح فقط بروابط HTTP/HTTPS
    */

    if(
        !url.startsWith("https://") &&
        !url.startsWith("http://")
    ){
        return "";
    }

    return url
        .replace(/"/g,"%22")
        .replace(/'/g,"%27");
}


/* =========================================
   GET PRODUCT IMAGES
========================================= */

function getProductImages(ad){

    const images = [];


    if(ad.image_url_1){

        images.push(
            ad.image_url_1
        );

    }


    if(ad.image_url_2){

        images.push(
            ad.image_url_2
        );

    }


    if(ad.image_url_3){

        images.push(
            ad.image_url_3
        );

    }


    /*
       توافق مع الإعلانات القديمة
    */

    if(
        images.length === 0 &&
        ad.image_url
    ){

        images.push(
            ad.image_url
        );

    }


    return images;

}


/* =========================================
   BUILD PRODUCT IMAGES
========================================= */

function buildProductImages(ad){

    const images =
        getProductImages(ad);


    if(images.length === 0){

        return `

            <div class="product-images">

                <div class="images-title">
                    📷 صور السلعة
                </div>

                <div class="no-product-image">
                    📦
                </div>

            </div>

        `;

    }


    const gridClass =
        images.length === 1
        ? "image-grid single"
        : "image-grid";


    const imagesHTML =
        images.map(
            function(url,index){

                const cleanURL =
                    safeURL(url);


                if(!cleanURL){
                    return "";
                }


                return `

                    <img
                        class="product-image"
                        src="${cleanURL}"
                        alt="صورة السلعة ${index + 1}"
                        loading="lazy"
                        onclick="openImageModal('${cleanURL}')"
                        onerror="
                            this.style.display='none';
                        "
                    >

                `;

            }
        ).join("");


    return `

        <div class="product-images">

            <div class="images-title">

                📷 صور السلعة

                <span
                    style="
                        color:#777;
                        font-size:13px;
                        font-weight:normal;
                    "
                >
                    (${images.length} ${images.length === 1 ? "صورة" : "صور"})
                </span>

            </div>


            <div class="${gridClass}">

                ${imagesHTML}

            </div>

        </div>

    `;

}


/* =========================================
   OPEN IMAGE MODAL
========================================= */

function openImageModal(url){

    if(!url){
        return;
    }


    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    if(!modal || !image){
        return;
    }


    image.src = url;

    modal.classList.add("show");

}


/* =========================================
   CLOSE IMAGE MODAL
========================================= */

function closeImageModal(){

    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    if(modal){

        modal.classList.remove(
            "show"
        );

    }


    if(image){

        image.src = "";

    }

}

/* =========================================
   CHANGE STATUS
========================================= */

async function changeStatus(
    id,
    status
){

    const question =
        status === "approved"

        ?

        "هل تريد الموافقة على الإعلان؟\n\nسيظهر الإعلان للزوار بعد الموافقة."

        :

        "هل تريد رفض الإعلان؟";


    if(
        !confirm(question)
    ){

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("ads")
    .update({
        status:status
    })
    .eq(
        "id",
        id
    );


    if(error){

        alert(
            "❌ حدث خطأ\n\n" +
            error.message
        );

        return;

    }


    alert(

        status === "approved"

        ?

        "✅ تمت الموافقة على الإعلان\n\nالإعلان أصبح ظاهرًا في المتجر."

        :

        "❌ تم رفض الإعلان"

    );


    await loadAds();

}

    const {
        error
    } =
    await supabaseClient
    .from("ads")
    .delete()
    .eq(
        "id",
        id
    );


    if(error){

        alert(
            "❌ حدث خطأ\n\n" +
            error.message
        );

        return;

    }


    alert(
        "🗑️ تم حذف الإعلان"
    );


    await loadAds();

}


/* =========================================
   STATS
========================================= */

function updateStats(ads){

    document.getElementById(
        "total"
    ).textContent =
        ads.length;


    document.getElementById(
        "pending"
    ).textContent =
        ads.filter(
            ad =>
            ad.status ===
            "pending"
        ).length;


    document.getElementById(
        "approved"
    ).textContent =
        ads.filter(
            ad =>
            ad.status ===
            "approved"
        ).length;


    document.getElementById(
        "rejected"
    ).textContent =
        ads.filter(
            ad =>
            ad.status ===
            "rejected"
        ).length;

}
