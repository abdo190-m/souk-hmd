<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://mpanymikmqajpppipmxy.supabase.co";


const SUPABASE_KEY =
"sb_publishable_gFcCXJ4jzWl4P8CDBi-uhQ_Gkr1EHa4";


let currentProject =
"souk";


/* =================================
   SUPABASE REQUEST
================================= */

async function request(
    endpoint,
    options={}
){

    const response =
        await fetch(

            SUPABASE_URL +
            endpoint,

            {

                ...options,

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})

                }

            }

        );


    const text =
        await response.text();


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status +
            " - " +
            text
        );

    }


    if(!text){

        return null;

    }


    try{

        return JSON.parse(
            text
        );

    }

    catch{

        return text;

    }

}


/* =================================
   ESCAPE
================================= */

function escapeHTML(
    text
){

    return String(
        text || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =================================
   LOGIN
================================= */

document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        login
    );


async function login(
    event
){

    event.preventDefault();


    const email =
        document
            .getElementById(
                "email"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    const button =
        document
            .getElementById(
                "loginButton"
            );


    const errorBox =
        document
            .getElementById(
                "loginError"
            );


    errorBox.style.display =
        "none";


    button.disabled =
        true;


    button.textContent =
        "جاري الدخول...";


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",

                {

                    method:
                        "POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                }

            );


        const text =
            await response.text();


        if(!response.ok){

            let message =
                "بيانات الدخول غير صحيحة";


            try{

                const data =
                    JSON.parse(
                        text
                    );


                if(
                    data.error_description
                ){

                    message =
                        data.error_description;

                }

                else if(
                    data.msg
                ){

                    message =
                        data.msg;

                }

            }

            catch{

                if(text){

                    message =
                        text;

                }

            }


            throw new Error(
                message
            );

        }


        const data =
            JSON.parse(
                text
            );


        /*
           نحفظ جلسة الدخول
        */

        localStorage.setItem(
            "souk_access_token",
            data.access_token
        );


        localStorage.setItem(
            "souk_refresh_token",
            data.refresh_token
        );


        showAdmin();


    }

    catch(error){

        console.error(
            error
        );


        errorBox.textContent =
            "❌ " +
            error.message;


        errorBox.style.display =
            "block";

    }


    finally{

        button.disabled =
            false;

        button.textContent =
            "دخول";

    }

}


/* =================================
   SHOW ADMIN
================================= */

function showAdmin(){

    document
        .getElementById(
            "loginPage"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "adminPage"
        )
        .style.display =
            "block";


    loadCurrentProject();

}


/* =================================
   LOGOUT
================================= */

function logout(){

    localStorage.removeItem(
        "souk_access_token"
    );


    localStorage.removeItem(
        "souk_refresh_token"
    );


    location.reload();

}


/* =================================
   AUTH CHECK
================================= */

function checkLogin(){

    const token =
        localStorage.getItem(
            "souk_access_token"
        );


    if(token){

        showAdmin();

    }

}


/* =================================
   REQUEST WITH USER TOKEN
================================= */

async function adminRequest(
    endpoint,
    options={}
){

    const token =
        localStorage.getItem(
            "souk_access_token"
        );


    if(!token){

        throw new Error(
            "انتهت جلسة الدخول"
        );

    }


    return request(

        endpoint,

        {

            ...options,

            headers:{

                ...(options.headers || {}),

                "Authorization":
                    "Bearer " +
                    token

            }

        }

    );

}


/* =================================
   SWITCH PROJECT
================================= */

function switchProject(
    project
){

    currentProject =
        project;


    document
        .getElementById(
            "soukBtn"
        )
        .classList.remove(
            "active"
        );


    document
        .getElementById(
            "ronqaBtn"
        )
        .classList.remove(
            "active"
        );


    if(
        project ===
        "souk"
    ){

        document
            .getElementById(
                "soukBtn"
            )
            .classList.add(
                "active"
            );

    }

    else{

        document
            .getElementById(
                "ronqaBtn"
            )
            .classList.add(
                "active"
            );

    }


    loadCurrentProject();

}


/* =================================
   LOAD CURRENT PROJECT
================================= */

function loadCurrentProject(){

    if(
        currentProject ===
        "souk"
    ){

        loadSouk();

    }

    else{

        loadRonqa();

    }

}
