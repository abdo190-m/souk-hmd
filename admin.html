<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Souk HMD - Admin</title>


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f5f7;
    color:#222;
}


/* =========================
   LOGIN
========================= */

#loginPage{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.loginBox{

    width:100%;

    max-width:400px;

    background:#fff;

    padding:30px;

    border-radius:18px;

    box-shadow:0 5px 25px rgba(0,0,0,.12);

}


.loginBox h1{

    text-align:center;

    margin:0 0 10px;

}


.loginBox p{

    text-align:center;

    color:#777;

    margin-bottom:25px;

}


.loginBox input{

    width:100%;

    padding:14px;

    margin-bottom:12px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:16px;

    direction:ltr;

}


#loginButton{

    width:100%;

    padding:14px;

    border:0;

    border-radius:10px;

    background:#111;

    color:white;

    font-size:16px;

    cursor:pointer;

}


#loginButton:disabled{

    opacity:.6;

}


#loginMessage{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    line-height:1.6;

}


.error{

    display:block !important;

    background:#f8d7da;

    color:#842029;

}


.success{

    display:block !important;

    background:#d1e7dd;

    color:#0f5132;

}


/* =========================
   ADMIN
========================= */

#adminPage{

    display:none;

}


header{

    background:#111;

    color:white;

    text-align:center;

    padding:22px;

}


header h1{

    margin:0 0 8px;

}


header p{

    margin:0;

    opacity:.7;

}


.container{

    max-width:1100px;

    margin:auto;

    padding:20px;

}


.topbar{

    background:#fff;

    padding:15px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;

}


.logout{

    background:#dc3545;

    color:white;

    border:0;

    padding:10px 16px;

    border-radius:9px;

}


/* =========================
   PROJECTS
========================= */

.projects{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

    margin-bottom:20px;

}


.project{

    border:0;

    background:white;

    padding:20px;

    border-radius:15px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}


.project.active{

    background:#111;

    color:white;

}


/* =========================
   STATS
========================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-bottom:20px;

}


.stat{

    background:white;

    padding:18px;

    border-radius:14px;

    text-align:center;

}


.statNumber{

    display:block;

    font-size:28px;

    font-weight:bold;

}


.statLabel{

    color:#777;

}


/* =========================
   CONTENT
========================= */

.section{

    background:white;

    padding:20px;

    border-radius:16px;

}


.sectionTop{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;

}


.refresh{

    border:0;

    background:#0d6efd;

    color:white;

    padding:10px 15px;

    border-radius:9px;

}


.ads{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px,1fr)
        );

    gap:15px;

}


.ad{

    border:1px solid #eee;

    border-radius:14px;

    padding:16px;

}


.ad h3{

    margin-top:0;

}


.info{

    line-height:1.9;

}


.status{

    display:inline-block;

    padding:5px 10px;

    border-radius:20px;

    font-size:13px;

}


.pending{

    background:#fff3cd;

    color:#856404;

}


.approved{

    background:#d1e7dd;

    color:#0f5132;

}


.rejected{

    background:#f8d7da;

    color:#842029;

}


.actions{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:15px;

}


.actions button{

    border:0;

    padding:10px 13px;

    border-radius:9px;

    color:white;

}


.approve{

    background:#198754;

}


.reject{

    background:#dc3545;

}


.delete{

    background:#212529;

}


.empty{

    text-align:center;

    padding:40px;

    color:#777;

}


@media(max-width:700px){

    .projects{

        grid-template-columns:1fr;

    }


    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }


    .topbar{

        flex-direction:column;

        gap:12px;

    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginPage">


<div class="loginBox">


<h1>
🔐 Souk HMD
</h1>


<p>
لوحة الإدارة
</p>


<form id="loginForm">


<input
    id="email"
    type="email"
    placeholder="البريد الإلكتروني"
    autocomplete="username"
    required
>


<input
    id="password"
    type="password"
    placeholder="كلمة المرور"
    autocomplete="current-password"
    required
>


<button
    id="loginButton"
    type="submit"
>

دخول

</button>


<div id="loginMessage"></div>


</form>


</div>


</div>



<!-- =========================
     ADMIN
========================= -->

<div id="adminPage">


<header>

<h1>
⚙️ لوحة الإدارة
</h1>

<p>
Souk HMD
</p>

</header>


<div class="container">


<div class="topbar">

<strong>
👤 الإدارة
</strong>


<button
    class="logout"
    onclick="logout()"
>

🚪 تسجيل الخروج

</button>

</div>


<div class="projects">


<button
    id="soukProject"
    class="project active"
    onclick="showSouk()"
>

🛒 Souk HMD

</button>


<button
    id="ronqaProject"
    class="project"
    onclick="showRonqa()"
>

🏪 Ronqa

</button>


</div>



<div class="stats">


<div class="stat">

<span
    id="total"
    class="statNumber"
>
0
</span>

<span class="statLabel">
الإجمالي
</span>

</div>


<div class="stat">

<span
    id="pending"
    class="statNumber"
>
0
</span>

<span class="statLabel">
Pending
</span>

</div>


<div class="stat">

<span
    id="approved"
    class="statNumber"
>
0
</span>

<span class="statLabel">
Approved
</span>

</div>


<div class="stat">

<span
    id="rejected"
    class="statNumber"
>
0
</span>

<span class="statLabel">
Rejected
</span>

</div>


</div>



<div class="section">


<div class="sectionTop">

<h2 id="title">
🛒 إعلانات Souk HMD
</h2>


<button
    class="refresh"
    onclick="loadAds()"
>

🔄 تحديث

</button>

</div>


<div
    id="ads"
    class="ads"
>

<div class="empty">

⏳ جاري التحميل...

</div>

</div>


</div>


</div>

</div>



<!-- =========================
     SUPABASE LIBRARY
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================
   SUPABASE SETTINGS
===================================== */

const SUPABASE_URL =
"https://mpanymikmqajpppipmxy.supabase.co";


const SUPABASE_KEY =
"sb_publishable_gFcCXJ4jzWl4P8CDBi-uhQ_Gkr1EHa4";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   ELEMENTS
===================================== */

const loginPage =
    document.getElementById(
        "loginPage"
    );


const adminPage =
    document.getElementById(
        "adminPage"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


/* =====================================
   LOGIN
===================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        loginButton.disabled =
            true;


        loginButton.textContent =
            "جاري تسجيل الدخول...";


        loginMessage.className =
            "";


        loginMessage.textContent =
            "";


        loginMessage.style.display =
            "none";


        try{


            const {
                data,
                error
            } =
                await supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.session
            ){

                throw new Error(
                    "لم يتم إنشاء جلسة الدخول."
                );

            }


            loginMessage.className =
                "success";


            loginMessage.textContent =
                "✅ تم تسجيل الدخول";


            loginMessage.style.display =
                "block";


            setTimeout(
                function(){

                    openAdmin();

                },
                500
            );


        }
        catch(error){


            console.error(
                "LOGIN ERROR:",
                error
            );


            loginMessage.className =
                "error";


            loginMessage.textContent =
                "❌ " +
                (
                    error.message ||
                    "فشل تسجيل الدخول"
                );


            loginMessage.style.display =
                "block";

        }
        finally{


            loginButton.disabled =
                false;


            loginButton.textContent =
                "دخول";

        }

    }
);


/* =====================================
   OPEN ADMIN
===================================== */

async function openAdmin(){

    loginPage.style.display =
        "none";


    adminPage.style.display =
        "block";


    await loadAds();

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();


    location.reload();

}


/* =====================================
   CHECK SESSION
===================================== */

async function checkSession(){

    const {
        data
    } =
        await supabaseClient
        .auth
        .getSession();


    if(
        data &&
        data.session
    ){

        openAdmin();

    }

}


/* =====================================
   LOAD ADS
===================================== */

async function loadAds(){

    const adsBox =
        document.getElementById(
            "ads"
        );


    adsBox.innerHTML = `

        <div class="empty">
            ⏳ جاري تحميل الإعلانات...
        </div>

    `;


    try{


        const {
            data,
            error
        } =
            await supabaseClient
            .from("ads")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        const ads =
            data || [];


        updateStats(
            ads
        );


        if(
            ads.length === 0
        ){

            adsBox.innerHTML = `

                <div class="empty">

                    📦

                    <h3>
                        لا توجد إعلانات
                    </h3>

                </div>

            `;

            return;

        }


        adsBox.innerHTML =
            "";


        ads.forEach(
            function(ad){

                const card =
                    document
                    .createElement("div");


                card.className =
                    "ad";


                let statusClass =
                    "pending";


                let statusText =
                    "قيد المراجعة";


                if(
                    ad.status ===
                    "approved"
                ){

                    statusClass =
                        "approved";

                    statusText =
                        "مقبول";

                }


                if(
                    ad.status ===
                    "rejected"
                ){

                    statusClass =
                        "rejected";

                    statusText =
                        "مرفوض";

                }


                card.innerHTML = `

                    <h3>
                        ${escapeHTML(
                            ad.title
                        )}
                    </h3>


                    <div class="info">

                        💰 السعر:
                        ${Number(
                            ad.price || 0
                        ).toLocaleString(
                            "fr-DZ"
                        )}
                        دج

                        <br>

                        📂 التصنيف:
                        ${escapeHTML(
                            ad.category
                        )}

                        <br>

                        📝 الوصف:
                        ${escapeHTML(
                            ad.description
                        )}

                        <br>

                        📞 الهاتف:
                        ${escapeHTML(
                            ad.phone
                        )}

                        <br>

                        📍 البلدية:
                        ${escapeHTML(
                            ad.city
                        )}

                        <br><br>

                        <span
                            class="status ${statusClass}"
                        >

                            ${statusText}

                        </span>

                    </div>


                    <div class="actions">


                        ${
                            ad.status !==
                            "approved"

                            ?

                            `

                            <button
                                class="approve"
                                onclick="
                                    updateStatus(
                                        ${ad.id},
                                        'approved'
                                    )
                                "
                            >

                                ✅ موافقة

                            </button>

                            `

                            : ""

                        }


                        ${
                            ad.status !==
                            "rejected"

                            ?

                            `

                            <button
                                class="reject"
                                onclick="
                                    updateStatus(
                                        ${ad.id},
                                        'rejected'
                                    )
                                "
                            >

                                ❌ رفض

                            </button>

                            `

                            : ""

                        }


                        <button
                            class="delete"
                            onclick="
                                deleteAd(
                                    ${ad.id}
                                )
                            "
                        >

                            🗑️ حذف

                        </button>


                    </div>

                `;


                adsBox.appendChild(
                    card
                );

            }
        );


    }
    catch(error){


        console.error(
            "LOAD ADS ERROR:",
            error
        );


        adsBox.innerHTML = `

            <div class="empty">

                ❌ حدث خطأ

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================
   STATS
===================================== */

function updateStats(
    ads
){

    document.getElementById(
        "total"
    ).textContent =
        ads.length;


    document.getElementById(
        "pending"
    ).textContent =
        ads.filter(
            ad =>
                ad.status ===
                "pending"
        ).length;


    document.getElementById(
        "approved"
    ).textContent =
        ads.filter(
            ad =>
                ad.status ===
                "approved"
        ).length;


    document.getElementById(
        "rejected"
    ).textContent =
        ads.filter(
            ad =>
                ad.status ===
                "rejected"
        ).length;

}


/* =====================================
   UPDATE STATUS
===================================== */

async function updateStatus(
    id,
    status
){

    const question =
        status === "approved"

        ? "هل تريد الموافقة على الإعلان؟"

        : "هل تريد رفض الإعلان؟";


    if(
        !confirm(question)
    ){

        return;

    }


    try{


        const {
            error
        } =
            await supabaseClient
            .from("ads")
            .update({
                status:
                    status
            })
            .eq(
                "id",
                id
            );


        if(error){

            throw error;

        }


        alert(

            status === "approved"

            ? "✅ تمت الموافقة"

            : "❌ تم الرفض"

        );


        loadAds();

    }
    catch(error){


        alert(
            "❌ حدث خطأ\n\n" +
            error.message
        );

    }

}


/* =====================================
   DELETE
===================================== */

async function deleteAd(
    id
){

    if(
        !confirm(
            "هل تريد حذف الإعلان نهائيًا؟"
        )
    ){

        return;

    }


    try{


        const {
            error
        } =
            await supabaseClient
            .from("ads")
            .delete()
            .eq(
                "id",
                id
            );


        if(error){

            throw error;

        }


        alert(
            "🗑️ تم حذف الإعلان"
        );


        loadAds();

    }
    catch(error){


        alert(
            "❌ حدث خطأ\n\n" +
            error.message
        );

    }

}


/* =====================================
   PROJECT BUTTONS
===================================== */

function showSouk(){

    document
    .getElementById(
        "soukProject"
    )
    .classList.add(
        "active"
    );


    document
    .getElementById(
        "ronqaProject"
    )
    .classList.remove(
        "active"
    );


    document
    .getElementById(
        "title"
    )
    .textContent =
        "🛒 إعلانات Souk HMD";


    loadAds();

}


function showRonqa(){

    document
    .getElementById(
        "ronqaProject"
    )
    .classList.add(
        "active"
    );


    document
    .getElementById(
        "soukProject"
    )
    .classList.remove(
        "active"
    );


    document
    .getElementById(
        "title"
    )
    .textContent =
        "🏪 Ronqa";


    document
    .getElementById(
        "ads"
    )
    .innerHTML = `

        <div class="empty">

            🏪

            <h3>
                Ronqa
            </h3>

            <p
            سيتم ربط لوحة Ronqa لاحقًا.
            </p>

        </div>

    `;

}


/* =====================================
   START
===================================== */

checkSession();

</script>

</body>

</html>
