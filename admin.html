<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souk HMD - Admin</title>

<style>
body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f5f7;
}

.login{
    width:90%;
    max-width:400px;
    margin:100px auto;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    box-sizing:border-box;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    direction:ltr;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#111;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

#message{
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<div class="login">

<h1>🔐 Souk HMD</h1>

<p style="text-align:center">
تسجيل دخول الإدارة
</p>

<input
    id="email"
    type="email"
    placeholder="البريد الإلكتروني"
    autocomplete="username"
>

<input
    id="password"
    type="password"
    placeholder="كلمة المرور"
    autocomplete="current-password"
>

<button
    id="login"
    type="button"
>
دخول
</button>

<div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mpanymikmqajpppipmxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gFcCXJ4jzWl4P8CDBi-uhQ_Gkr1EHa4";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


document
.getElementById("login")
.addEventListener(
    "click",
    async function(){

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;

        const message =
            document
            .getElementById("message");


        if(!email || !password){

            message.style.color="red";

            message.textContent=
                "❌ أدخل الإيميل وكلمة المرور";

            return;
        }


        message.style.color="#555";

        message.textContent=
            "جاري تسجيل الدخول...";


        try{

            const {
                data,
                error
            } =
            await supabaseClient
            .auth
            .signInWithPassword({

                email:email,

                password:password

            });


            if(error){

                throw error;

            }


            if(!data.session){

                throw new Error(
                    "لم يتم إنشاء جلسة الدخول"
                );

            }


            message.style.color="green";

            message.textContent=
                "✅ تم تسجيل الدخول";


            /*
             * مؤقتًا فقط:
             * بعد نجاح الدخول نعرض رسالة
             * بدل الانتقال إلى ملف غير موجود.
             */

        }
        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );

            message.style.color="red";

            message.textContent=
                "❌ " +
                error.message;

        }

    }
);

</script>

</body>
</html>
